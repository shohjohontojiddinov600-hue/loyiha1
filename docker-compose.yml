version: '3.8'

services:
  app:
    build: .
    container_name: smart_market_app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://smart_user:SecretPass123@postgres:5432/smart_market_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: smart_market_postgres
    restart: always
    environment:
      POSTGRES_USER: smart_user
      POSTGRES_PASSWORD: SecretPass123
      POSTGRES_DB: smart_market_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: smart_market_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

